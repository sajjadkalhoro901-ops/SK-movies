name: Build SK Movies Android App

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'app/build.gradle'
      - 'app/src/**'
      - 'app/settings.gradle'
      - 'index.html'
      - 'script.js'
      - 'site-core.js'
      - 'anime-player.js'
      - 'style.css'
      - 'images/**'
      - '.github/workflows/build-android-app.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync website into Android assets
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          cp index.html script.js site-core.js anime-player.js style.css app/src/main/assets/
          if [ -d images ]; then cp -R images app/src/main/assets/; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SK-Movies-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
